name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-secrets.mjs
      - run: node check.mjs
      - run: node --input-type=module -e "const { Impit } = await import('impit'); new Impit({ browser: 'chrome' })"
      - run: bun test
